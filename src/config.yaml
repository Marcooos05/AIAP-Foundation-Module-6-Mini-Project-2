file_path: "./data/mini_project_2_data.csv"
target_column: "no_show"
positive_class: "1"              # no-show = 1 is the positive class (compared as strings)
val_test_size: 0.2
validation_size: 0.5             # 80/10/10 train/validation/test, stratified on the target
random_state: 42
cv: 5
scoring: roc_auc                 # GridSearchCV scoring and model-selection metric (EDA §5)
n_jobs: -1                       # parallel workers (-1 = all cores)
usd_to_sgd: 1.37                 # USD prices are SGD / 1.37 for every room type (EDA §4.1)
onehot_min_frequency: 1          # every category has hundreds of rows, so no grouping (EDA §7.1)
# Ways to handle the 63/37 class imbalance, compared inside every grid search (EDA §5):
#   none         - train on the data as is
#   class_weight - class_weight='balanced' (Logistic Regression, Decision Tree, Random Forest only)
#   undersample  - randomly drop majority-class rows in each training fold
#   oversample   - randomly repeat minority-class rows in each training fold
imbalance_strategies: [none, class_weight, undersample, oversample]
param_grids:
  logistic_regression:
    classifier__C: [0.01, 0.1, 1.0, 10.0]
  knn:
    classifier__n_neighbors: [15, 51]
  decision_tree:
    classifier__max_depth: [5, 10, 20]
    classifier__min_samples_leaf: [20, 100]
  random_forest:
    classifier__n_estimators: [200]
    classifier__max_depth: [10, 20]
    classifier__min_samples_leaf: [1, 10]
  gradient_boosting:
    classifier__n_estimators: [200]
    classifier__learning_rate: [0.05, 0.1]
    classifier__max_depth: [3, 5]
# Identifier; removed during cleaning.
columns_to_drop: [booking_id]
# Final features chosen in EDA §10.5. Columns not listed in any role are dropped by the preprocessor
# (checkout_month, booking_month, arrival_day, checkout_day, platform).
numeric_features:
  - lead_time_months
  - stay_nights
  - price_sgd
  - num_adults
  - num_children
nominal_features:
  - country
  - branch
  - first_time
  - arrival_month
  - room
ordinal_features: []
ordinal_categories: {}
